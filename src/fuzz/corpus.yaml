%YAML 1.2
%TAG !e! tag:example.com,2000:app/
---
# ============================================================================
# libfyaml fuzzing corpus - a single, feature-dense YAML document.
#
# Embedded into the harness (corpus_yaml.h, #embed) and handed straight to
# fy_document_build_from_string() by the tests that used to spend half of
# their fuzzer bytes on a throw-away document. The fuzzer input now drives
# only the interesting side: paths, ypath expressions, scanf formats,
# comment payloads, mapping keys.
#
# Rules for editing:
#   * stays ONE document (no second '---') - fy_document_build_from_string()
#     builds exactly one
#   * the root stays a MAPPING - test_mapping_operations*() bail otherwise
#   * no duplicate keys inside any single mapping (parsing fails without
#     FYPCF_ALLOW_DUPLICATE_KEYS), and at most one '<<' per mapping
#   * no recursive aliases - FYPCF_RESOLVE_DOCUMENT would chase them forever
#   * keep the short top-level keys (a, b, c, k, 0, 1, key, name, ...) - they
#     are what randomly-mutated paths actually have a chance of hitting
# ============================================================================

# ── short keys: cheap targets for mutated paths ─────────────────────────────
a: 1
b: two
c: [3, 4]
d: {e: 5}
k: v
x: null
y: true
z: ~
0: zero
1: one
2: 2.0
key: key-value
name: corpus
value: 42
list: [a, b, c]
map: {a: 1, b: 2}
seq:
  - first
  - second
  - third
str: plain scalar
num: -17
: value-of-the-empty-key

# ── null / bool / int / float resolution (core + 1.1 schemas) ───────────────
nulls:
  tilde: ~
  lower: null
  title: Null
  upper: NULL
  empty:
  quoted: "null"

bools:
  true_lower: true
  true_title: True
  true_upper: TRUE
  false_lower: false
  false_title: False
  false_upper: FALSE
  yes_11: yes
  no_11: no
  on_11: on
  off_11: off
  y_11: y
  n_11: n
  quoted: "true"

ints:
  zero: 0
  positive: 12345
  negative: -12345
  explicit_plus: +12345
  minus_zero: -0
  underscored: 1_000_000
  octal_11: 0123
  octal_12: 0o17
  hex: 0x1F2E
  hex_underscored: 0x_1F_2E
  binary_11: 0b1010_0111
  sexagesimal_11: 190:20:30
  int64_max: 9223372036854775807
  int64_min: -9223372036854775808
  uint64_max: 18446744073709551615
  overflow: 99999999999999999999999999999999
  quoted: "12345"

floats:
  simple: 1.5
  canonical: 6.8523015e+5
  exponential: 12.3015e+02
  negative_exp: 1.2e-99
  fixed: 1230.15
  leading_dot: .5
  trailing_dot: 5.
  negative: -0.0
  underscored: 1_230.15
  sexagesimal_11: 190:20:30.15
  positive_inf: .inf
  negative_inf: -.Inf
  upper_inf: .INF
  not_a_number: .NaN
  nan_upper: .NAN
  huge: 1e999999999
  tiny: 1e-999999999

# ── every scalar style ──────────────────────────────────────────────────────
scalars:
  plain: a plain scalar with spaces
  plain_with_colon: 12:30 is not a mapping here
  plain_with_hash: value#not-a-comment
  plain_multiline: this plain scalar
    continues on the next line
    and on a third one
  single: 'single quoted'
  single_escaped: 'it''s got an embedded quote'
  single_multiline: 'single quoted
    spanning lines'
  single_empty: ''
  double: "double quoted"
  double_escaped: "tab:\t nl:\n cr:\r nul:\0 bell:\a bs:\b vt:\v ff:\f esc:\e"
  double_unicode: "hex:\x41 bmp:é astral:\U0001F600 nel:\N nbsp:\_ ls:\L ps:\P"
  double_specials: "quote:\" slash:\/ backslash:\\"
  double_multiline: "double quoted
    folded onto one line"
  double_continuation: "no space here:\
    joined"
  double_empty: ""
  long_line: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

# ── block scalars: both styles, every chomping and indent indicator ─────────
block_scalars:
  literal: |
    line one
    line two

    line four after a blank
  literal_strip: |-
    no trailing newline
  literal_keep: |+
    trailing newlines kept


  literal_indent: |2
     two-space indented body
     second line
  literal_indent_strip: |2-
     indented and stripped
  literal_more_indented: |
    normal
        more indented
    normal again
  folded: >
    these lines
    fold into one

    this is a second paragraph
  folded_strip: >-
    folded without
    a trailing newline
  folded_keep: >+
    folded and kept

  folded_indent: >1
   one-space indented fold
   second line
  folded_more_indented: >
    folded text
      but this line is more indented so it stays
    folded again

# ── flow collections ────────────────────────────────────────────────────────
flow:
  empty_seq: []
  empty_map: {}
  seq: [1, 2, 3]
  map: {a: 1, b: 2}
  nested: [[1, [2, [3, [4]]]], {a: {b: {c: {d: 1}}}}]
  mixed: [{a: 1}, [b], "c", 'd', null, true, 5]
  key_no_value: {solo}
  value_empty: {a: }
  key_empty: {: v}
  seq_of_maps: [{k: 1}, {k: 2}, {k: 3}]
  explicit_key: {? complex: value}
  multiline: [
      1,
      2,
      3
    ]
  in_block_key: {a: 1, b: [2, 3]}
  deep: [[[[[[[[[[nested]]]]]]]]]]
  quoted_keys: {"double": 1, 'single': 2}

# ── tags: shorthand, verbatim, local, named handle ──────────────────────────
tags:
  str: !!str 12345
  int: !!int "42"
  float: !!float "3.14"
  bool: !!bool "true"
  null_tag: !!null "~"
  seq: !!seq [a, b]
  map: !!map {a: 1}
  verbatim: !<tag:yaml.org,2002:str> verbatim tagged
  verbatim_local: !<!local-type> local verbatim
  local: !local-tag local tagged
  named_handle: !e!widget named handle tagged
  percent_escaped: !%21escaped percent escaped tag
  non_specific: ! non specific
  on_seq: !local-seq
    - a
    - b
  on_map: !local-map
    a: 1
  set: !!set
    ? apple
    ? banana
    ? cherry
  omap: !!omap
    - first: 1
    - second: 2
    - third: 3
  pairs: !!pairs
    - repeated: 1
    - repeated: 2
    - repeated: 3
  binary: !!binary |
    R0lGODlhDAAMAIQAAP//9/X17unp5WZmZgAAAOfn515eXvPz7Y6OjuDg4J+fn5
    OTk6enp56enmlpaWNjY6Ojo4SEhP/++f/++f/++f/++f/++f/++f/++f/++f/+
    +f/++f/++f/++f/++f/++SH+Dk1hZGUgd2l0aCBHSU1QACwAAAAADAAMAAAFLC
    AgjoEwnuNAFOhpEMTRiggcz4BNJHrv/zCFcLiwMWYNG84BwwEeECcgggoBADs=

# ── timestamps (1.1 schema) ─────────────────────────────────────────────────
timestamps:
  canonical: 2001-12-15T02:59:43.1Z
  iso8601: 2001-12-14t21:59:43.10-05:00
  spaced: 2001-12-14 21:59:43.10 -5
  date_only: 2002-12-14
  quoted: "2001-12-15T02:59:43.1Z"

# ── anchors, aliases and merge keys ─────────────────────────────────────────
anchors:
  scalar: &anchor_scalar anchored scalar
  tagged: !!str &anchor_tagged tagged and anchored
  tag_first: &anchor_tag_first !!str anchor before tag
  seq: &anchor_seq [1, 2, 3]
  map: &anchor_map {a: 1, b: 2}
  block_map: &anchor_block
    nested: value
    deeper:
      key: leaf
  block_seq: &anchor_block_seq
    - one
    - two
  empty: &anchor_empty
  unicode: &anchor_ünïcödé unicode anchor name
  long: &aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa long anchor name

aliases:
  to_scalar: *anchor_scalar
  to_tagged: *anchor_tagged
  to_seq: *anchor_seq
  to_map: *anchor_map
  to_block: *anchor_block
  to_block_seq: *anchor_block_seq
  to_empty: *anchor_empty
  to_unicode: *anchor_ünïcödé
  in_seq: [*anchor_scalar, *anchor_seq]
  in_map: {v: *anchor_map}
  as_key:
    *anchor_scalar : alias used as a key

merge_defaults: &merge_defaults
  adapter: postgres
  host: localhost
  port: 5432

merge_overrides: &merge_overrides
  port: 6543
  pool: 8

merge_single:
  <<: *merge_defaults
  database: single

merge_multiple:
  <<: [*merge_overrides, *merge_defaults]
  database: multiple

merge_explicit_tag:
  !!merge << : *merge_defaults
  database: explicit

# ── complex (explicit) keys ─────────────────────────────────────────────────
complex_keys:
  ? explicit simple key
  : explicit simple value
  ? [a, b]
  : sequence as key
  ? {k: v}
  : mapping as key
  ? |
    literal block
    as a key
  : literal block value
  ? >
    folded block as key
  : folded block value
  ? &complex_anchor anchored complex key
  : anchored complex value
  ? !!str tagged complex key
  : tagged complex value
  ?
  : value of the explicit null key
  ? "quoted complex key"
  : quoted complex value

# ── keys of every shape ─────────────────────────────────────────────────────
keys:
  "double quoted key": 1
  'single quoted key': 2
  key with spaces: 3
  key:with:colons: 4
  key-with-dashes: 5
  key_with_underscores: 6
  key.with.dots: 7
  key/with/slashes: 8
  "key\twith\tescapes": 9
  ünïcödé-key: 10
  日本語のキー: 11
  "": 12
  "0": 13
  "3": 14
  "true": 15
  "~": 16
  # (a bare `~:` key would collide with the quoted "~" above)
  very_long_key_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: 18

# ── unicode payloads ────────────────────────────────────────────────────────
unicode:
  latin1: "café naïve résumé"
  greek: "αβγδε ζηθικ"
  cyrillic: "Привет мир"
  cjk: "日本語 中文 한국어"
  rtl: "مرحبا بالعالم"
  hebrew: "שלום עולם"
  emoji: "😀 🎉 🚀 👨‍👩‍👧‍👦"
  combining: "é à ñ"
  math: "∀x∈ℝ: x² ≥ 0"
  box_drawing: "┌─┬─┐ │ │ └─┴─┘"
  nbsp: "a\_b"
  bmp_max: "�"
  astral: "\U0001F600\U0010FFFF"
  plain_unicode: héllo wörld
  zero_width: "a​b"

# ── comments in every position ──────────────────────────────────────────────
# a comment before the key
comments: # a comment after the key
  # a comment above the value
  before: value # a comment after the value
  # comment between entries

  after_blank: value
  in_seq:
    # comment above the item
    - one # comment after the item
    # comment between items
    - two
  in_flow: [ # comment inside a flow seq
      1,
      2 # after a flow item
    ]
  empty_comment: #
  hash_in_string: "# not a comment"
# a trailing comment for the block

# ── empty and degenerate values ─────────────────────────────────────────────
empties:
  empty_value:
  empty_string: ""
  empty_seq: []
  empty_map: {}
  seq_of_empties:
    -
    -
    -
  map_of_empties:
    a:
    b:
    c:
  nested_empty:
    inner:
      innermost:

# ── deep nesting: gives ypath /** something to recurse through ──────────────
deep:
  l1:
    l2:
      l3:
        l4:
          l5:
            l6:
              l7:
                l8:
                  l9:
                    l10:
                      leaf: bottom
                      sibling: [1, 2, {end: true}]

deep_seq:
  - - - - - - - - - - deeply nested sequence leaf

# ── mixed structure for sequence/mapping walkers ────────────────────────────
mixed:
  - scalar
  - [nested, sequence]
  - {nested: mapping}
  - &mixed_anchor anchored in a sequence
  - *mixed_anchor
  - !!str tagged in a sequence
  - |
    block scalar in a sequence
  - >
    folded scalar in a sequence
  -
  - - deeper
    - - deeper still

